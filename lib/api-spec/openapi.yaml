  /admin/venue-owner/applications:
    get:
      operationId: listVenueApplications
      tags: [admin]
      summary: List venue applications for review
      description: |
        Defaults to the live review queue (submitted, under_review,
        resubmitted). Pass `status=all`, or a comma-separated list of
        lifecycle statuses, to audit decided applications. Date filters use the
        most recent submission time, so resubmitted applications appear in the
        period in which they re-entered review.
      parameters:
        - name: status
          in: query
          required: false
          description: "`queue` (default), `all`, or a comma-separated list of lifecycle statuses."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Only include applications submitted or resubmitted at or after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only include applications submitted or resubmitted before this instant.
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          description: Match business name, venue name, place ID, owner UID, or application ID.
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Matching applications plus lifecycle counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueApplicationQueue"
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
