components:
  parameters:
    VenueApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    MetUid:
      type: apiKey
      in: header
      name: X-Met-Uid
      description: Firebase UID of the requesting user (MVP — replace with verified ID token later)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    VenueAdminPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
    VenueAdminBootstrap:
      type: object
      required: [bootstrapCode, password]
      properties:
        bootstrapCode:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
    VenueAdminPasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
    VenueAdminRecovery:
