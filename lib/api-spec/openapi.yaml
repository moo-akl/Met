openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: encounters
    description: Encounter logging operations
  - name: presence
    description: Location-based proximity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the authenticated user's profile
      security:
        - MetUid: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: upsertMyProfile
      tags: [profiles]
      summary: Create or update the authenticated user's profile
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfile"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/{uid}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by user id
      security:
        - MetUid: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /encounters:
    post:
      operationId: logEncounter
      tags: [encounters]
      summary: Log a Bluetooth detection of another user
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEncounter"
      responses:
        "200":
          description: Encounter recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
    get:
      operationId: listMyEncounters
      tags: [encounters]
      summary: List encounters observed by the authenticated user
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EncounterWithProfile"

  /presence:
    put:
      operationId: updatePresence
      tags: [presence]
      summary: Update the authenticated user's last known location
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePresence"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceRecord"

  /ble/resolve:
    post:
      operationId: bleResolve
      tags: [ble]
      summary: Resolve BLE identity hashes to user profiles
      description: |
        Given an array of 16-char hex identity hashes (the first 8 bytes of
        SHA-256(uid)), returns the matching profiles. Used by the BLE
        scanner to look up a UID after detecting a Met advertisement.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BleResolveRequest"
      responses:
        "200":
          description: List of matched profiles. Unmatched hashes are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BleResolveEntry"

  /presence/nearby:
    get:
      operationId: nearbyPresence
      tags: [presence]
      summary: List Met users near a coordinate
      description: Returns users within `radiusM` meters whose presence was updated within `maxAgeMin` minutes. Excludes the caller.
      security:
        - MetUid: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: radiusM
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 5000
        - name: maxAgeMin
          in: query
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
            maximum: 1440
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbyEntry"

components:
  securitySchemes:
    MetUid:
      type: apiKey
      in: header
      name: X-Met-Uid
      description: Firebase UID of the requesting user (MVP — replace with verified ID token later)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    Profile:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        socials:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - displayName
        - createdAt
        - updatedAt
    UpsertProfile:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 500
        socials:
          type: object
          additionalProperties:
            type: string
      required:
        - displayName
    LogEncounter:
      type: object
      properties:
        observedUid:
          type: string
          minLength: 1
        rssi:
          type: integer
          nullable: true
      required:
        - observedUid
    Encounter:
      type: object
      properties:
        id:
          type: integer
        observerUid:
          type: string
        observedUid:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        encounterCount:
          type: integer
        lastRssi:
          type: integer
          nullable: true
      required:
        - id
        - observerUid
        - observedUid
        - firstSeenAt
        - lastSeenAt
        - encounterCount
    EncounterWithProfile:
      allOf:
        - $ref: "#/components/schemas/Encounter"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/Profile"
          required:
            - profile
    UpdatePresence:
      type: object
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          format: double
          nullable: true
      required:
        - lat
        - lng
    PresenceRecord:
      type: object
      properties:
        uid:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracyM:
          type: number
          format: double
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - lat
        - lng
        - updatedAt
    NearbyEntry:
      type: object
      properties:
        uid:
          type: string
        distanceM:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - distanceM
        - updatedAt
    BleResolveRequest:
      type: object
      properties:
        hashes:
          type: array
          items:
            type: string
            pattern: "^[0-9a-f]{16}$"
          minItems: 1
          maxItems: 64
      required:
        - hashes
    BleResolveEntry:
      type: object
      properties:
        hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - hash
        - profile
