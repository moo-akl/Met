components:
  securitySchemes:
    MetUid:
      type: apiKey
      in: header
      name: X-Met-Uid
      description: Firebase UID of the requesting user (MVP — replace with verified ID token later)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    Profile:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        socials:
          type: object
          additionalProperties:
            type: string
        interests:
          type: array
          items:
            type: string
          nullable: true
          description: User-selected interest tags (predefined list, up to 10).
        isVisible:
          type: boolean
          description: |
            Ghost Mode flag. When false, this user is hidden from other
            devices' nearby queries. Defaults to true on creation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - displayName
        - isVisible
        - createdAt
        - updatedAt
    UpsertProfile:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 500
        socials:
          type: object
          additionalProperties:
            type: string
        interests:
          type: array
          items:
            type: string
            maxLength: 32
          nullable: true
          maxItems: 10
          description: Selected interest tags. Optional on upsert; null preserves existing.
        isVisible:
          type: boolean
          description: Ghost Mode flag. Optional on upsert; preserved when omitted.
        preferredLocale:
          type: string
          nullable: true
          description: BCP-47 language code selected in the app. Optional on upsert; null preserves existing.
      required:
        - displayName
    LogEncounter:
      type: object
      properties:
        observedUid:
          type: string
          minLength: 1
        rssi:
          type: integer
          nullable: true
      required:
        - observedUid
    RecordEncounter:
      type: object
      properties:
        otherUid:
          type: string
          minLength: 1
        location:
          type: object
          nullable: true
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
          required:
            - lat
            - lng
      required:
        - otherUid
    RecordEncounterResult:
      type: object
      properties:
        otherUid:
          type: string
        metCount:
          type: integer
          description: Stored met count on this user's side after the write.
        lastMet:
          type: string
          format: date-time
      required:
        - otherUid
        - metCount
        - lastMet
    Encounter:
      type: object
      properties:
        id:
          type: integer
        observerUid:
          type: string
        observedUid:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        encounterCount:
          type: integer
        lastRssi:
          type: integer
          nullable: true
      required:
        - id
        - observerUid
        - observedUid
        - firstSeenAt
        - lastSeenAt
        - encounterCount
    EncounterWithProfile:
      allOf:
        - $ref: "#/components/schemas/Encounter"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/Profile"
          required:
            - profile
    UpdatePresence:
      type: object
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          format: double
          nullable: true
      required:
        - lat
        - lng
    PresenceRecord:
      type: object
      properties:
        uid:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracyM:
          type: number
          format: double
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - lat
        - lng
        - updatedAt
    NearbyEntry:
      type: object
      properties:
        uid:
          type: string
        distanceM:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - distanceM
        - updatedAt
    BleResolveRequest:
      type: object
      properties:
        hashes:
          type: array
          items:
            type: string
            pattern: "^[0-9a-f]{16}$"
          minItems: 1
          maxItems: 64
      required:
        - hashes
    BleResolveEntry:
      type: object
      properties:
        hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - hash
        - profile
    CreateRevealRequest:
      type: object
      properties:
        recipientUid:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          nullable: true
          maxLength: 240
      required:
        - recipientUid
    RespondToReveal:
      type: object
      properties:
        senderUid:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - senderUid
    RevealRequest:
      type: object
      properties:
        id:
          type: integer
        senderUid:
          type: string
        recipientUid:
          type: string
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, accepted, declined]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - senderUid
        - recipientUid
        - status
        - createdAt
        - updatedAt
    RevealRequestWithProfile:
      allOf:
        - $ref: "#/components/schemas/RevealRequest"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/Profile"
          required:
            - profile
    RegisterReferralCode:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
    RedeemReferralCode:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
    ReferralStatsResponse:
      type: object
      required:
        - code
        - count
        - rewardActive
        - rewardExpiresAt
      properties:
        code:
          type: string
          nullable: true
        count:
          type: integer
        rewardActive:
          type: boolean
        rewardExpiresAt:
          type: number
          nullable: true
    NetworkCategory:
      type: string
      enum: [university, work, neighborhood, custom]
    Network:
      type: object
      required:
        - id
        - name
        - category
        - createdByUid
        - isPublic
        - requiresApproval
        - memberCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
