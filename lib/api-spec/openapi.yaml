openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: encounters
    description: Encounter logging operations
  - name: presence
    description: Location-based proximity
  - name: reveals
    description: Mutual-reveal request lifecycle
  - name: referrals
    description: Referral / invite-a-friend operations
  - name: networks
    description: Community networks (university, work, neighborhood, custom)
paths:
  /saved-places:
    get:
      operationId: listSavedPlaces
      summary: List the authenticated user's saved venues
      security:
        - MetUid: []
      responses:
        "200":
          description: Saved venues, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedPlace"
  /saved-places/{placeId}:
    parameters:
      - in: path
        name: placeId
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
    put:
      operationId: savePlace
      summary: Save a real approved venue without recording a visit
      security:
        - MetUid: []
      responses:
        "200":
          description: Venue saved (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlace"
        "404":
          description: No approved venue exists
    delete:
      operationId: unsavePlace
      summary: Remove only the authenticated user's bookmark
      security:
        - MetUid: []
      responses:
        "204":
          description: Bookmark removed (idempotent)
  /hubs/qr-verify:
    post:
      operationId: verifyVenueQr
      tags: [profiles]
      summary: Record a venue QR visit for the authenticated account
      description: >
        Photo-less accounts record a private visit only, without public
        leaderboard or reward credit. This does not enable social visibility
        and a static QR token is not independent proof of GPS presence.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueQrInput"
      responses:
        "200":
          description: The visit was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueQrResult"
        "400":
          description: Invalid request
        "401":
          description: Sign-in required
        "403":
          description: QR token does not match
        "404":
          description: Venue not found or not approved

  /hubs/checkin:
    post:
      operationId: postHubCheckin
      tags: [profiles]
      summary: Check in at a nearby venue
      description: >
        Registered venues configured for open check-in require server-side
        location validation, a verified Firebase App Check token in production,
        and device-reported location accuracy. QR-only venues retain proximity
        detection without public leaderboard or reward credit until a QR scan
        is verified. App Check verifies the calling app/device, not physical
        location; coordinates and reported accuracy remain client-provided.
      parameters:
        - in: header
          name: X-Firebase-AppCheck
          required: false
          schema:
            type: string
          description: Required for open-location check-ins in production; QR-verified requests do not require it.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubCheckinInput"
      responses:
        "200":
          description: The check-in was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCheckinResult"
        "400":
          description: Invalid coordinates
        "401":
          description: Sign-in required
        "403":
          description: Check-in cooldown, App Check, or venue location validation failed
        "404":
          description: No recognized venue found
  /hubs/{placeId}/checkin-status:
    get:
      operationId: getHubCheckinStatus
      tags: [profiles]
      summary: Get the caller's check-in status at a venue
      security:
        - MetUid: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Venue mode and the caller's verified visit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCheckinStatus"
        "401":
          description: Sign-in required

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the authenticated user's profile
      security:
        - MetUid: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: upsertMyProfile
      tags: [profiles]
      summary: Create or update the authenticated user's profile
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfile"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: expectedVisibilityVersion is required when enabling visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Visibility changed since the client last read the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profiles/me/notification-prefs:
    patch:
      operationId: syncMyNotificationPreferences
      tags: [profiles]
      summary: Update notification opt-out preferences
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefsInput"
      responses:
        "200":
          description: Notification preferences updated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401": { description: Unauthorized }

  /profiles/{uid}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by user id
      security:
        - MetUid: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /encounters:
    post:
      operationId: logEncounter
      tags: [encounters]
      summary: Log a Bluetooth detection of another user
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEncounter"
      responses:
        "200":
          description: Encounter recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
    get:
      operationId: listMyEncounters
      tags: [encounters]
      summary: List encounters observed by the authenticated user
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EncounterWithProfile"

  /encounters/record:
    post:
      operationId: recordEncounter
      tags: [encounters]
      summary: Record a symmetric Firestore encounter with another user
      description: |
        Writes mirror entries to `users/{me}/met_people/{other}` AND
        `users/{other}/met_people/{me}` in Firestore using the Admin SDK,
        using a single batched commit so both sides see the encounter
        atomically. Caller-provided location is stored as a GeoPoint on
        both docs. Idempotent within the configured cooldown window.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordEncounter"
      responses:
        "200":
          description: Encounter recorded on both sides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEncounterResult"
        "400":
          description: Invalid input (e.g. self-targeted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Other user has no profile or is not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /presence:
    put:
      operationId: updatePresence
      tags: [presence]
      summary: Update the authenticated user's last known location
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePresence"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceRecord"

  /reveals:
    post:
      operationId: createRevealRequest
      tags: [reveals]
      summary: Send a reveal request to another user
      description: |
        Upserts a reveal request between the authenticated user (sender) and
        the recipient. If a row already exists for this pair it is reset to
        `pending` with a fresh `createdAt` and the new optional message.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRevealRequest"
      responses:
        "200":
          description: Reveal request created or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealRequestWithProfile"
        "400":
          description: Invalid input (e.g. self-targeted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Recipient profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reveals/inbox:
    get:
      operationId: listInboundReveals
      tags: [reveals]
      summary: List pending reveal requests addressed to me
      description: |
        Returns all reveal requests where the authenticated user is the
        recipient and status is `pending`. Each entry includes the sender's
        profile so the client can render the encounter without a separate
        profile lookup.
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevealRequestWithProfile"

  /reveals/outbox:
    get:
      operationId: listOutboundReveals
      tags: [reveals]
      summary: List my outgoing reveal requests with their current status
      description: |
        Returns reveal requests where the authenticated user is the sender,
        regardless of status. Used by the client to detect when a recipient
        accepts or declines an outgoing request.
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevealRequestWithProfile"

  /reveals/accept:
    post:
      operationId: acceptRevealRequest
      tags: [reveals]
      summary: Accept the pending reveal request from a specific sender
      description: |
        The authenticated user (recipient) accepts the most-recent pending
        reveal request from `senderUid`. Also auto-accepts any pending
        reverse request from the recipient back to the sender so mutual
        consent is symmetric.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToReveal"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealRequest"
        "404":
          description: No pending request from that sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reveals/decline:
    post:
      operationId: declineRevealRequest
      tags: [reveals]
      summary: Decline the pending reveal request from a specific sender
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToReveal"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealRequest"
        "404":
          description: No pending request from that sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ble/resolve:
    post:
      operationId: bleResolve
      tags: [ble]
      summary: Resolve BLE identity hashes to user profiles
      description: |
        Given an array of 16-char hex identity hashes (the first 8 bytes of
        SHA-256(uid)), returns the matching profiles. Used by the BLE
        scanner to look up a UID after detecting a Met advertisement.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BleResolveRequest"
      responses:
        "200":
          description: List of matched profiles. Unmatched hashes are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BleResolveEntry"

  /presence/nearby:
    get:
      operationId: nearbyPresence
      tags: [presence]
      summary: List Met users near a coordinate
      description: Returns users within `radiusM` meters whose presence was updated within `maxAgeMin` minutes. Excludes the caller.
      security:
        - MetUid: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: radiusM
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 5000
        - name: maxAgeMin
          in: query
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
            maximum: 1440
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbyEntry"

  /referrals/register:
    post:
      operationId: registerReferralCode
      tags: [referrals]
      summary: Register your referral code
      description: Stores the caller's referral code server-side. Call once after generating the code locally.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterReferralCode"
      responses:
        "200":
          description: Code registered
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                properties:
                  code:
                    type: string
        "401":
          description: Unauthorized

  /referrals/redeem:
    post:
      operationId: redeemReferralCode
      tags: [referrals]
      summary: Redeem someone else's referral code
      description: Validates the code, records the redemption, and grants the inviter a Plus month when they hit 3 invites.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemReferralCode"
      responses:
        "200":
          description: Redemption result
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: string
                    enum:
                      - accepted
                      - invalid_format
                      - self_referral
                      - already_used
                      - code_not_found
        "401":
          description: Unauthorized

  /referrals/stats:
    get:
      operationId: getReferralStats
      tags: [referrals]
      summary: Get my referral stats
      description: Returns the caller's referral code, invite count, and reward status.
      security:
        - MetUid: []
      responses:
        "200":
          description: Referral stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralStatsResponse"
        "401":
          description: Unauthorized

  /networks/join/{code}:
    get:
      operationId: getNetworkByCode
      tags: [networks]
      summary: Look up a network by invite code (public preview)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
      responses:
        "200":
          description: Network detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkListEntry"
        "404":
          description: No network with that invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: joinNetworkByCode
      tags: [networks]
      summary: Join a network using its invite code
      security:
        - MetUid: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
      responses:
        "200":
          description: Membership result
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [active, pending]
        "404":
          description: No network with that invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

  /networks/{id}/regenerate-code:
    post:
      operationId: regenerateNetworkCode
      tags: [networks]
      summary: Regenerate invite code for a network (admin only)
      security:
        - MetUid: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New invite code
          content:
            application/json:
              schema:
                type: object
                required:
                  - inviteCode
                properties:
                  inviteCode:
                    type: string
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Network not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

  /networks/resolve-neighborhood:
    get:
      operationId: resolveNeighborhood
      tags: [networks]
      summary: Reverse-geocode coordinates to a neighborhood name
      description: Calls Nominatim to resolve lat/lng to a human-readable neighborhood name for pre-filling the network creation form.
      security:
        - MetUid: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Resolved neighborhood info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborhoodInfo"
        "401":
          description: Unauthorized

  /networks/mine:
    get:
      operationId: getMyNetworks
      tags: [networks]
      summary: List networks I have joined
      security:
        - MetUid: []
      responses:
        "200":
          description: My networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkListEntry"
        "401":
          description: Unauthorized

  /networks:
    post:
      operationId: createNetwork
      tags: [networks]
      summary: Create a new network
      description: Creator is automatically added as admin. For neighborhood networks, pass lat/lng and the API will reverse-geocode the neighborhood name.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNetwork"
      responses:
        "201":
          description: Created network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkListEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
    get:
      operationId: listNetworks
      tags: [networks]
      summary: Browse / search networks
      description: Returns public networks, optionally filtered by category or proximity (for neighborhood networks).
      security:
        - MetUid: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NetworkCategory"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Free-text search on network name
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkListEntry"
        "401":
          description: Unauthorized

  /networks/{id}:
    get:
      operationId: getNetwork
      tags: [networks]
      summary: Get a network by ID
      security:
        - MetUid: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Network detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkListEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
    patch:
      operationId: updateNetwork
      tags: [networks]
      summary: Update a network (admin only)
      security:
        - MetUid: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNetwork"
      responses:
        "200":
          description: Updated network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkListEntry"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteNetwork
      tags: [networks]
      summary: Delete a network (admin only)
      security:
        - MetUid: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

  /networks/{id}/join:
    post:
      operationId: joinNetwork
      tags: [networks]
      summary: Join a network
      description: For public networks the member is immediately active. For approval-required networks the status is pending.
      security:
        - MetUid: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership result
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [active, pending]
        "404":
          description: Network not found
          content:
            application/json:
              schema:
