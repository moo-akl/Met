  /admin/venue-owner/applications:
    get:
      operationId: listVenueApplications
      tags: [admin]
      summary: List venue applications for review
      description: |
        Defaults to the live review queue (submitted, under_review,
        resubmitted). Pass `status=all`, or a comma-separated list of
        lifecycle statuses, to audit decided applications. Date filters use the
        most recent submission time, so resubmitted applications appear in the
        period in which they re-entered review.
      parameters:
        - name: status
          in: query
          required: false
          description: "`queue` (default), `all`, or a comma-separated list of lifecycle statuses."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Only include applications submitted or resubmitted at or after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only include applications submitted or resubmitted before this instant.
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          description: Match business name, venue name, place ID, owner UID, or application ID.
          schema:
            type: string
            maxLength: 120
        - name: source
          in: query
          required: false
          description: "Filter by application source: `mobile`, `web`, `agent`, or `admin`."
          schema:
            type: string
            enum: [mobile, web, agent, admin]
      responses:
        "200":
          description: Matching applications plus lifecycle counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueApplicationQueue"
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No active admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/venue-owner/applications/{id}:
    get:
      operationId: getVenueApplicationForReview
      tags: [admin]
      summary: Get one application with its full audit trail
      description: |
        Reviewer-only view. Unlike the applicant status endpoint, the history
        returned here includes internal reviewer notes.
      parameters:
        - $ref: "#/components/parameters/VenueApplicationId"
      responses:
        "200":
          description: Application and full review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueApplicationReviewDetail"
        "401":
          description: No active admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

