openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: encounters
    description: Encounter logging operations
  - name: presence
    description: Location-based proximity
  - name: reveals
    description: Mutual-reveal request lifecycle
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the authenticated user's profile
      security:
        - MetUid: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: upsertMyProfile
      tags: [profiles]
      summary: Create or update the authenticated user's profile
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfile"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/{uid}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by user id
      security:
        - MetUid: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /encounters:
    post:
      operationId: logEncounter
      tags: [encounters]
      summary: Log a Bluetooth detection of another user
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEncounter"
      responses:
        "200":
          description: Encounter recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
    get:
      operationId: listMyEncounters
      tags: [encounters]
      summary: List encounters observed by the authenticated user
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EncounterWithProfile"

  /encounters/record:
    post:
      operationId: recordEncounter
      tags: [encounters]
      summary: Record a symmetric Firestore encounter with another user
      description: |
        Writes mirror entries to `users/{me}/met_people/{other}` AND
        `users/{other}/met_people/{me}` in Firestore using the Admin SDK,
        using a single batched commit so both sides see the encounter
        atomically. Caller-provided location is stored as a GeoPoint on
        both docs. Idempotent within the configured cooldown window.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordEncounter"
      responses:
        "200":
          description: Encounter recorded on both sides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEncounterResult"
        "400":
          description: Invalid input (e.g. self-targeted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Other user has no profile or is not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /presence:
    put:
      operationId: updatePresence
      tags: [presence]
      summary: Update the authenticated user's last known location
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePresence"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceRecord"

  /reveals:
    post:
      operationId: createRevealRequest
      tags: [reveals]
      summary: Send a reveal request to another user
      description: |
        Upserts a reveal request between the authenticated user (sender) and
        the recipient. If a row already exists for this pair it is reset to
        `pending` with a fresh `createdAt` and the new optional message.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRevealRequest"
      responses:
        "200":
          description: Reveal request created or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealRequestWithProfile"
        "400":
          description: Invalid input (e.g. self-targeted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Recipient profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reveals/inbox:
    get:
      operationId: listInboundReveals
      tags: [reveals]
      summary: List pending reveal requests addressed to me
      description: |
        Returns all reveal requests where the authenticated user is the
        recipient and status is `pending`. Each entry includes the sender's
        profile so the client can render the encounter without a separate
        profile lookup.
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevealRequestWithProfile"

  /reveals/outbox:
    get:
      operationId: listOutboundReveals
      tags: [reveals]
      summary: List my outgoing reveal requests with their current status
      description: |
        Returns reveal requests where the authenticated user is the sender,
        regardless of status. Used by the client to detect when a recipient
        accepts or declines an outgoing request.
      security:
        - MetUid: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevealRequestWithProfile"

  /reveals/accept:
    post:
      operationId: acceptRevealRequest
      tags: [reveals]
      summary: Accept the pending reveal request from a specific sender
      description: |
        The authenticated user (recipient) accepts the most-recent pending
        reveal request from `senderUid`. Also auto-accepts any pending
        reverse request from the recipient back to the sender so mutual
        consent is symmetric.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToReveal"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealRequest"
        "404":
          description: No pending request from that sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reveals/decline:
    post:
      operationId: declineRevealRequest
      tags: [reveals]
      summary: Decline the pending reveal request from a specific sender
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToReveal"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealRequest"
        "404":
          description: No pending request from that sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ble/resolve:
    post:
      operationId: bleResolve
      tags: [ble]
      summary: Resolve BLE identity hashes to user profiles
      description: |
        Given an array of 16-char hex identity hashes (the first 8 bytes of
        SHA-256(uid)), returns the matching profiles. Used by the BLE
        scanner to look up a UID after detecting a Met advertisement.
      security:
        - MetUid: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BleResolveRequest"
      responses:
        "200":
          description: List of matched profiles. Unmatched hashes are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BleResolveEntry"

  /presence/nearby:
    get:
      operationId: nearbyPresence
      tags: [presence]
      summary: List Met users near a coordinate
      description: Returns users within `radiusM` meters whose presence was updated within `maxAgeMin` minutes. Excludes the caller.
      security:
        - MetUid: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: radiusM
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 5000
        - name: maxAgeMin
          in: query
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
            maximum: 1440
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbyEntry"

components:
  securitySchemes:
    MetUid:
      type: apiKey
      in: header
      name: X-Met-Uid
      description: Firebase UID of the requesting user (MVP — replace with verified ID token later)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    Profile:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        socials:
          type: object
          additionalProperties:
            type: string
        interests:
          type: array
          items:
            type: string
          nullable: true
          description: User-selected interest tags (predefined list, up to 10).
        isVisible:
          type: boolean
          description: |
            Ghost Mode flag. When false, this user is hidden from other
            devices' nearby queries. Defaults to true on creation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - displayName
        - isVisible
        - createdAt
        - updatedAt
    UpsertProfile:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        photoUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 500
        socials:
          type: object
          additionalProperties:
            type: string
        interests:
          type: array
          items:
            type: string
            maxLength: 32
          nullable: true
          maxItems: 10
          description: Selected interest tags. Optional on upsert; null preserves existing.
        isVisible:
          type: boolean
          description: Ghost Mode flag. Optional on upsert; preserved when omitted.
        preferredLocale:
          type: string
          nullable: true
          description: BCP-47 language code selected in the app. Optional on upsert; null preserves existing.
      required:
        - displayName
    LogEncounter:
      type: object
      properties:
        observedUid:
          type: string
          minLength: 1
        rssi:
          type: integer
          nullable: true
      required:
        - observedUid
    RecordEncounter:
      type: object
      properties:
        otherUid:
          type: string
          minLength: 1
        location:
          type: object
          nullable: true
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
          required:
            - lat
            - lng
      required:
        - otherUid
    RecordEncounterResult:
      type: object
      properties:
        otherUid:
          type: string
        metCount:
          type: integer
          description: Stored met count on this user's side after the write.
        lastMet:
          type: string
          format: date-time
      required:
        - otherUid
        - metCount
        - lastMet
    Encounter:
      type: object
      properties:
        id:
          type: integer
        observerUid:
          type: string
        observedUid:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        encounterCount:
          type: integer
        lastRssi:
          type: integer
          nullable: true
      required:
        - id
        - observerUid
        - observedUid
        - firstSeenAt
        - lastSeenAt
        - encounterCount
    EncounterWithProfile:
      allOf:
        - $ref: "#/components/schemas/Encounter"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/Profile"
          required:
            - profile
    UpdatePresence:
      type: object
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          format: double
          nullable: true
      required:
        - lat
        - lng
    PresenceRecord:
      type: object
      properties:
        uid:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracyM:
          type: number
          format: double
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - lat
        - lng
        - updatedAt
    NearbyEntry:
      type: object
      properties:
        uid:
          type: string
        distanceM:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - distanceM
        - updatedAt
    BleResolveRequest:
      type: object
      properties:
        hashes:
          type: array
          items:
            type: string
            pattern: "^[0-9a-f]{16}$"
          minItems: 1
          maxItems: 64
      required:
        - hashes
    BleResolveEntry:
      type: object
      properties:
        hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - hash
        - profile
    CreateRevealRequest:
      type: object
      properties:
        recipientUid:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          nullable: true
          maxLength: 240
      required:
        - recipientUid
    RespondToReveal:
      type: object
      properties:
        senderUid:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - senderUid
    RevealRequest:
      type: object
      properties:
        id:
          type: integer
        senderUid:
          type: string
        recipientUid:
          type: string
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, accepted, declined]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - senderUid
        - recipientUid
        - status
        - createdAt
        - updatedAt
    RevealRequestWithProfile:
      allOf:
        - $ref: "#/components/schemas/RevealRequest"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/Profile"
          required:
            - profile
