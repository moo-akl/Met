          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueActivationReminderResponse" }
        "401":
          description: No active admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Venue is not eligible for a reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/venue-owner/applications/{id}/activation/exception:
    parameters:
      - $ref: "#/components/parameters/VenueApplicationId"
    post:
      operationId: updateVenueActivationException
      tags: [admin]
      summary: Set or clear an activation-policy exemption with an audited reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueActivationExceptionInput" }
      responses:
        "200":
          description: Updated activation policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueActivationResponse" }
        "400":
          description: Invalid exemption details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No active admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Venue has not opted into activation policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/venue-owner/applications/{id}/activation/reinstate:
    parameters:
      - $ref: "#/components/parameters/VenueApplicationId"
    post:
      operationId: reinstateVenueActivation
      tags: [admin]
      summary: Explicitly restore a venue that was soft-unlisted by activation policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueActivationReinstateInput" }
      responses:
        "200":
          description: Reinstated activation policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueActivationResponse" }
        "400":
          description: Invalid reinstatement reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No active admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Venue is not currently activation-delisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /venue-owner/process-activation:
    post:
      operationId: processVenueActivation
      tags: [cron]
      summary: Process due venue activation reminders and soft-delisting milestones
      parameters:
        - $ref: "#/components/parameters/CronSecret"
      responses:
        "200":
          description: Activation policies processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueActivationProcessResponse" }
        "401":
          description: Invalid cron secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Cron endpoints are not enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  # QR visits use the same authenticated identity as the rest of Met.
  parameters:
    VenueApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    VenueBusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VenueManagerId:
      name: managerId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VenueEventId:
      name: eventId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VenueRewardId:
      name: rewardId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VenueAnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VenueManagerCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    CronSecret:
      name: x-cron-secret
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    VenueIntroProfileKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
  securitySchemes:
    MetUid:
      type: apiKey
      in: header
      name: X-Met-Uid
      description: Firebase UID of the requesting user (MVP — replace with verified ID token later)
    VenueAdminSessionCookie:
      type: apiKey
      in: cookie
      name: met_venue_admin
      description: Signed Venue Admin session cookie
  schemas:
    SavedPlace:
      type: object
      required: [placeId, placeName, savedAt, available]
      properties:
        placeId:
          type: string
        placeName:
          type: string
        savedAt:
          type: string
          format: date-time
        available:
          type: boolean
          description: Whether the venue currently has an approved public profile
    VenueCheckinMode:
      type: string
      enum: [open, qr_only]
    HubCheckinInput:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy:
          type: number
          minimum: 0
          description: Horizontal accuracy in metres reported by the device's location API.
        mocked:
          type: boolean
          description: OS-reported simulated-location flag when the platform exposes it; this is not cryptographic attestation.
        placeId: { type: string, minLength: 1 }
        placeName: { type: string, maxLength: 255 }
    HubCheckinResult:
      type: object
      required: [placeId, placeName, streak, streak_points, checkin_multiplier, isRegisteredVenue, isQrVerified, checkInMode, privateOnly]
      properties:
        placeId: { type: string }
        placeName: { type: string }
        streak: { type: integer, minimum: 0 }
        streak_points: { type: integer, minimum: 0 }
        checkin_multiplier: { type: number, minimum: 1 }
        isRegisteredVenue: { type: boolean }
        isQrVerified: { type: boolean }
        checkInMode: { type: ["string", "null"], enum: [open, qr_only, null] }
        privateOnly: { type: boolean }
    HubCheckinStatus:
      type: object
      required: [isRegisteredVenue, isQrVerified, checkInMode, hasOpenCheckin]
      properties:
        isRegisteredVenue: { type: boolean }
        isQrVerified: { type: boolean }
        checkInMode: { type: ["string", "null"], enum: [open, qr_only, null] }
        hasOpenCheckin: { type: boolean }
    VenueQrInput:
      type: object
      required: [placeId, token]
      properties:
        placeId:
          type: string
          minLength: 1
        token:
          type: string
          format: uuid
    VenueQrResult:
      type: object
      required: [verified, streak]
      properties:
        verified:
          type: boolean
        streak:
          type: integer
          minimum: 0
        privateOnly:
          type: boolean
          description: True when no public leaderboard or reward check-in was created.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    VenueActivation:
      type: object
      required:
        - firstInvitationSentAt
        - registrationDeadline
        - registeredAt
        - qrDeadline
        - qrVerifiedCheckins
        - reminder5SentAt
        - reminder10SentAt
        - reminder5AttemptedAt
        - reminder10AttemptedAt
        - unlistedAt
        - removalReason
        - exempt
      properties:
        firstInvitationSentAt: { type: ["string", "null"], format: date-time }
        registrationDeadline: { type: ["string", "null"], format: date-time }
        registeredAt: { type: ["string", "null"], format: date-time }
        qrDeadline: { type: ["string", "null"], format: date-time }
        qrVerifiedCheckins: { type: integer, minimum: 0 }
        reminder5SentAt: { type: ["string", "null"], format: date-time }
        reminder10SentAt: { type: ["string", "null"], format: date-time }
        reminder5AttemptedAt: { type: ["string", "null"], format: date-time }
        reminder10AttemptedAt: { type: ["string", "null"], format: date-time }
        unlistedAt: { type: ["string", "null"], format: date-time }
        removalReason: { type: ["string", "null"], enum: [registration, qr_checkins, null] }
        exempt: { type: boolean }
    VenueActivationResponse:
      type: object
      required: [activation]
      properties:
        activation: { $ref: "#/components/schemas/VenueActivation" }
    VenueActivationReminderResponse:
      allOf:
        - $ref: "#/components/schemas/VenueActivationResponse"
        - type: object
          required: [sent]
          properties:
            sent: { type: boolean }
    VenueActivationReminderInput:
      type: object
      additionalProperties: false
      properties: {}
    VenueActivationExceptionInput:
      type: object
      additionalProperties: false
      required: [exempt, reason]
      properties:
        exempt: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    VenueActivationReinstateInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    VenueActivationProcessResponse:
      type: object
      required: [remindersClaimed, reminderSent, unlistedRegistration, unlistedQrCheckins]
      properties:
        remindersClaimed: { type: integer, minimum: 0 }
        reminderSent: { type: integer, minimum: 0 }
        unlistedRegistration: { type: integer, minimum: 0 }
        unlistedQrCheckins: { type: integer, minimum: 0 }
    VenueAdminPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
    VenueAdminBootstrap:
      type: object
      required: [bootstrapCode, password]
      properties:
        bootstrapCode:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
    VenueAdminPasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
    VenueAdminRecovery:
      type: object
      required: [bootstrapCode, newPassword]
      properties:
        bootstrapCode:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
    VenueAdminSetupState:
      type: object
      required: [setupRequired, serverConfigured]
      properties:
        setupRequired:
          type: boolean
        serverConfigured:
          type: boolean
    VenueAdminSession:
      type: object
      required: [authenticated, expiresAt]
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    VenueIntroProfile:
      type: object
      required:
        - key
        - venueName
        - coverCopy
        - slide2Heading
        - slide2Copy
        - slide3Heading
        - slide3Copy
      properties:
        key: { type: string, minLength: 1, maxLength: 120 }
        venueName: { type: string, minLength: 2, maxLength: 100 }
        coverCopy: { type: string, minLength: 2, maxLength: 240 }
        slide2Heading: { type: string, minLength: 2, maxLength: 100 }
        slide2Copy: { type: string, minLength: 2, maxLength: 300 }
        slide3Heading: { type: string, minLength: 2, maxLength: 100 }
        slide3Copy: { type: string, minLength: 2, maxLength: 300 }
    VenueIntroProfileInput:
      type: object
      required:
        - venueName
        - coverCopy
        - slide2Heading
        - slide2Copy
        - slide3Heading
        - slide3Copy
      properties:
        venueName: { type: string, minLength: 2, maxLength: 100 }
        coverCopy: { type: string, minLength: 2, maxLength: 240 }
        slide2Heading: { type: string, minLength: 2, maxLength: 100 }
        slide2Copy: { type: string, minLength: 2, maxLength: 300 }
        slide3Heading: { type: string, minLength: 2, maxLength: 100 }
        slide3Copy: { type: string, minLength: 2, maxLength: 300 }
    VenueManagerSession:
      type: object
      required: [authenticated, csrfToken, expiresAt]
      properties:
        authenticated: { type: boolean }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    VenueManagerFirebaseConfig:
      type: object
      required: [apiKey, authDomain, projectId]
      properties:
        apiKey: { type: string, minLength: 1 }
        authDomain: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
    VenueManagerFirebaseProof:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 1 }
    VenueManagerFirebaseLink:
      type: object
      required: [idToken, legacyPassword]
      properties:
        idToken: { type: string, minLength: 1 }
        legacyPassword: { type: string, minLength: 1 }
    VenueContactRequestInput:
      type: object
      required: [recipientEmail]
      properties:
        recipientEmail: { type: string, format: email, maxLength: 255 }
    VenueEmailTemplateInput:
      type: object
      required: [name, subject, body, format]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        subject: { type: string, minLength: 1, maxLength: 998 }
        body: { type: string, minLength: 1, maxLength: 200000 }
        format: { type: string, enum: [text, html] }
    VenueEmailTemplate:
      allOf:
        - $ref: "#/components/schemas/VenueEmailTemplateInput"
        - type: object
          required: [id, builtin]
          properties:
            id: { type: string }
            builtin: { type: boolean }
    VenuePdfAttachment:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName: { type: string, minLength: 5, maxLength: 180 }
        contentBase64: { type: string, minLength: 8, maxLength: 8000000 }
    VenueManualEmailInput:
      type: object
      required: [templateId, businessName, recipientEmail]
      properties:
        templateId: { type: string, minLength: 1, maxLength: 150 }
        bulkInvitation: { type: boolean, description: Replace the greeting with a generic invitation for pasted email lists. }
        businessName: { type: string, minLength: 1, maxLength: 255 }
        recipientEmail: { type: string, format: email, maxLength: 255 }
        venueFitReason: { type: string, maxLength: 500, description: A short venue-specific reason for the invitation. }
        placeId: { type: string, maxLength: 255 }
        venueOwnerProfileId: { type: integer, minimum: 1 }
        retryOfLogId: { type: integer, minimum: 1, description: ID of the exact bounced outreach record being retried. }
        pdfAttachment:
          $ref: "#/components/schemas/VenuePdfAttachment"

    VenueOutreachInput:
      type: object
      required: [businessName, recipientEmail]
      properties:
        businessName: { type: string, minLength: 2, maxLength: 150 }
        recipientEmail: { type: string, format: email, maxLength: 255 }
        placeId: { type: string, maxLength: 255 }
        template:
          type: string
          enum: [contact_request, met_launch_with_links, met_launch_without_links, met_u_foot_traffic_legacy, preapproval_video_application, introduction, benefits, events, rewards, follow_up, latest_updates, latest_updates_prospect]
          default: contact_request
    VenueOutreachPreviewInput:
      type: object
      required: [businessName]
      properties:
        businessName: { type: string, minLength: 2, maxLength: 150 }
    VenueOutreachTemplatePreview:
      type: object
      required: [id, label, description, subject, text]
      properties:
        id:
          type: string
          enum: [contact_request, met_launch_with_links, met_launch_without_links, met_u_foot_traffic_legacy, preapproval_video_application, introduction, benefits, events, rewards, follow_up, latest_updates, latest_updates_prospect]
        label: { type: string }
        description: { type: string }
        subject: { type: string }
        text: { type: string }
    VenueOutreachHistoryEntry:
      type: object
      required:
        - id
        - kind
        - businessName
        - recipientEmail
        - template
        - deliveryStatus
        - deliveryFailureStatus
        - deliveryFailureReason
        - createdAt
        - sentAt
        - venueOwnerProfileId
        - applicationId
        - applicationStatus
        - placeId
        - gmailRepliedAt
        - gmailThreadId
        - gmailReplyClassification
        - expiresAt
        - linkStatus
        - venueKey
        - assignedAgentId
        - assignedAgentName
        - nextActionNote
        - nextActionDueDate
        - manualInterestLevel
        - manualReplyEvents
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [new_venue_outreach, contact_request, registration_invite, manager_announcement]
        businessName: { type: string }
        recipientEmail: { type: string, format: email }
        template: { type: string }
        templateName: { type: ["string", "null"] }
        deliveryStatus:
          type: string
          enum: [sending, sent, delivery_uncertain, failed, bounced]
        deliveryFailureStatus: { type: ["string", "null"], maxLength: 32 }
        deliveryFailureReason: { type: ["string", "null"], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        sentAt: { type: ["string", "null"], format: date-time }
        venueOwnerProfileId: { type: ["integer", "null"] }
        applicationId: { type: ["integer", "null"] }
        applicationStatus: { type: ["string", "null"] }
        placeId: { type: ["string", "null"], maxLength: 255 }
        gmailRepliedAt: { type: ["string", "null"], format: date-time }
        gmailThreadId: { type: ["string", "null"] }
        gmailReplyClassification:
          type: ["string", "null"]
          enum: [interested, rejected, other, uncertain, null]
        expiresAt: { type: ["string", "null"], format: date-time }
        linkStatus:
          type: string
          enum: [none, active, expired, used, superseded, unknown]
        venueKey: { type: string }
        assignedAgentId: { type: ["integer", "null"] }
        assignedAgentName: { type: ["string", "null"] }
        nextActionNote: { type: ["string", "null"] }
        nextActionDueDate:
          type: ["string", "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        manualInterestLevel:
          type: ["string", "null"]
          enum: [top_interest, interest, no_interest, null]
        manualReplyEvents:
          type: array
          items:
            $ref: "#/components/schemas/VenueOutreachManualReplyEvent"
    VenueOutreachFollowUpInput:
      type: object
      required: [venueKey, nextActionNote, nextActionDueDate]
      properties:
        venueKey: { type: string, minLength: 1, maxLength: 512 }
        nextActionNote: { type: ["string", "null"], maxLength: 1000 }
        nextActionDueDate:
          type: ["string", "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    VenueOutreachFollowUp:
      type: object
      required: [venueKey, nextActionNote, nextActionDueDate, updatedAt]
      properties:
        venueKey: { type: string }
        nextActionNote: { type: ["string", "null"] }
        nextActionDueDate:
          type: ["string", "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        updatedAt: { type: string, format: date-time }
    VenueOutreachManualInterestInput:
      type: object
      required: [venueKey, manualInterestLevel]
      properties:
        venueKey: { type: string, minLength: 1, maxLength: 512 }
        manualInterestLevel:
          type: ["string", "null"]
          enum: [top_interest, interest, no_interest, null]
    VenueOutreachManualInterest:
      type: object
      required: [venueKey, manualInterestLevel, updatedAt]
      properties:
        venueKey: { type: string }
        manualInterestLevel:
          type: ["string", "null"]
          enum: [top_interest, interest, no_interest, null]
        updatedAt: { type: string, format: date-time }
    VenueOutreachManualReplyEventInput:
      type: object
      required: [venueKey, action]
      properties:
        venueKey: { type: string, minLength: 1, maxLength: 512 }
        action:
          type: string
          enum: [mark_replied, undo_mark]
    VenueOutreachManualReplyEvent:
      type: object
      required: [id, venueKey, action, actorUid, createdAt]
      properties:
        id: { type: string }
        venueKey: { type: string }
        action:
          type: string
          enum: [mark_replied, undo_mark]
        actorUid: { type: string }
        createdAt: { type: string, format: date-time }
    VenueOutreachManualReplyEventResult:
      type: object
      required: [venueKey, action, actorUid, createdAt]
      properties:
        venueKey: { type: string }
        action:
          type: string
          enum: [mark_replied, undo_mark]
        actorUid: { type: string }
        createdAt: { type: string, format: date-time }
    VenueOutreachPlaceIdInput:
      type: object
      required: [placeId]
      properties:
        placeId: { type: ["string", "null"], minLength: 1, maxLength: 255 }
    VenueOutreachPlaceIdResult:
      type: object
      required: [id, placeId]
      properties:
        id: { type: integer }
        placeId: { type: ["string", "null"], maxLength: 255 }
    VenueManagerUpdateAudience:
      type: object
      required: [recipientCount, registeredManagerCount, contactedProspectCount]
      properties:
        recipientCount: { type: integer, minimum: 0 }
        registeredManagerCount: { type: integer, minimum: 0 }
        contactedProspectCount: { type: integer, minimum: 0 }
    VenueManagerUpdateBroadcastInput:
      type: object
      required: [template, expectedRecipientCount, expectedRegisteredManagerCount, expectedContactedProspectCount, confirm]
      properties:
        template:
          type: string
          enum: [latest_updates]
        expectedRecipientCount: { type: integer, minimum: 1 }
        expectedRegisteredManagerCount: { type: integer, minimum: 0 }
        expectedContactedProspectCount: { type: integer, minimum: 0 }
        confirm:
          type: boolean
          enum: [true]
    VenueManagerUpdateBroadcastResult:
      type: object
      required: [recipientCount, registeredManagerCount, contactedProspectCount, sentCount, deliveryUncertainCount, notAttemptedCount, stoppedReason]
      properties:
        recipientCount: { type: integer, minimum: 0 }
        registeredManagerCount: { type: integer, minimum: 0 }
        contactedProspectCount: { type: integer, minimum: 0 }
        sentCount: { type: integer, minimum: 0 }
        deliveryUncertainCount: { type: integer, minimum: 0 }
        notAttemptedCount: { type: integer, minimum: 0 }
        stoppedReason:
          type: ["string", "null"]
          enum: [delivery_uncertain, audit_log_failed, preparation_failed, null]
    VenueOutreachHistoryResponse:
      type: object
      required: [emails, suppressedEmails]
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/VenueOutreachHistoryEntry"
        suppressedEmails:
          type: array
          items: { type: string, format: email }
    VenueOutreachHistoryDeleteInput:
      type: object
      required: [venueKey, eventIds, confirm]
      properties:
        venueKey: { type: string, minLength: 1, maxLength: 512 }
        eventIds:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, minLength: 1, maxLength: 64 }
        confirm:
          type: boolean
          enum: [true]
    VenueOutreachHistoryDeleteResult:
      type: object
      required: [venueKey, deletedEmailCount, revokedInvitationCount, message]
      properties:
        venueKey: { type: string }
        deletedEmailCount: { type: integer, minimum: 1 }
        revokedInvitationCount: { type: integer, minimum: 0 }
        message: { type: string }
    DeleteAdminVenueResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
    SyncGmailVenueOutreachRepliesResult:
      type: object
      required: [scannedCount, matchedReplyCount, updatedSendCount, classificationPendingCount, truncated, lookbackDays]
      properties:
        scannedCount: { type: integer, minimum: 0 }
        matchedReplyCount: { type: integer, minimum: 0 }
        updatedSendCount: { type: integer, minimum: 0 }
        classificationPendingCount: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        lookbackDays: { type: integer, minimum: 1 }
    ClassifyPendingVenueOutreachRepliesResult:
      type: object
      required: [attemptedReplyCount, classifiedReplyCount, classificationFailedCount, classificationPendingCount, deferredCount]
      properties:
        attemptedReplyCount: { type: integer, minimum: 0 }
        classifiedReplyCount: { type: integer, minimum: 0 }
        classificationFailedCount: { type: integer, minimum: 0 }
        classificationPendingCount: { type: integer, minimum: 0 }
        deferredCount: { type: integer, minimum: 0 }
    VenueOutreachEmailSuppressionInput:
      type: object
      required: [email, suppressed]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        suppressed: { type: boolean }
    VenueOutreachEmailSuppressionResult:
      type: object
      required: [email, suppressed]
      properties:
        email: { type: string, format: email }
        suppressed: { type: boolean }
    ClearFailedVenueOutreachInput:
      type: object
      required: [confirm, expectedFailedEmailCount, expectedBouncedEmailCount]
      properties:
        confirm: { type: boolean, enum: [true] }
        expectedFailedEmailCount: { type: integer, minimum: 0, description: Count of failed attempts with no recorded sent time. }
