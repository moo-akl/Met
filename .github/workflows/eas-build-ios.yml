name: EAS Build — iOS Production

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: "Submit to TestFlight after build?"
        type: boolean
        default: true

jobs:
  build:
    name: Build & submit iOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build iOS (production)
        working-directory: artifacts/met
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to TestFlight
        if: ${{ inputs.submit_to_testflight }}
        working-directory: artifacts/met
        run: eas submit --platform ios --profile production --non-interactive --latest
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
