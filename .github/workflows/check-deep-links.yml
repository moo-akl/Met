name: Check Deep Links

# Verify that the Apple Universal Links and Android App Links verification
# files are reachable and contain the correct app identifiers.
# If either check fails, GitHub marks the run as failed and sends an
# email notification to the repository owner.

on:
  schedule:
    # Run every day at 08:00 UTC
    - cron: "0 8 * * *"
  # Allow manual runs from the Actions tab for quick diagnosis
  workflow_dispatch:

jobs:
  verify:
    name: Verify deep-link verification files
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://metapp.replit.app"
      # Expected Apple identifier: TeamID.BundleID
      EXPECTED_APPLE_APP_ID: "AWHU9BTQQX.app.met.founders"
      # Expected Android package name
      EXPECTED_ANDROID_PACKAGE: "app.met.founders"
      # Expected Android SHA-256 fingerprint (from Play Console → App integrity)
      EXPECTED_ANDROID_SHA256: "A0:FF:D9:D6:F1:6C:9F:C8:FB:72:7A:84:F6:3E:01:5B:FE:9F:B1:F1:83:A3:ED:0B:AC:00:55:23:5B:3F:42:59"

    steps:
      - name: Check apple-app-site-association
        run: |
          URL="${BASE_URL}/.well-known/apple-app-site-association"
          echo "Fetching $URL"

          HTTP_CODE=$(curl -sf --max-time 15 \
            -H "Accept: application/json" \
            -w "%{http_code}" \
            -o /tmp/aasa.json \
            "$URL" || true)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Expected HTTP 200 but got $HTTP_CODE from $URL"
            exit 1
          fi

          # Validate JSON is parseable
          if ! jq . /tmp/aasa.json > /dev/null 2>&1; then
            echo "ERROR: Response is not valid JSON:"
            cat /tmp/aasa.json
            exit 1
          fi

          echo "Response:"
          jq . /tmp/aasa.json

          # Assert the expected appID appears under applinks.details[*].appID
          FOUND=$(jq -r '.applinks.details[].appID // empty' /tmp/aasa.json | grep -Fx "$EXPECTED_APPLE_APP_ID" || true)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Expected appID '$EXPECTED_APPLE_APP_ID' not found in apple-app-site-association"
            exit 1
          fi

          echo "✓ apple-app-site-association OK — appID $EXPECTED_APPLE_APP_ID present"

      - name: Check assetlinks.json
        run: |
          URL="${BASE_URL}/.well-known/assetlinks.json"
          echo "Fetching $URL"

          HTTP_CODE=$(curl -sf --max-time 15 \
            -H "Accept: application/json" \
            -w "%{http_code}" \
            -o /tmp/assetlinks.json \
            "$URL" || true)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Expected HTTP 200 but got $HTTP_CODE from $URL"
            exit 1
          fi

          # Validate JSON is parseable
          if ! jq . /tmp/assetlinks.json > /dev/null 2>&1; then
            echo "ERROR: Response is not valid JSON:"
            cat /tmp/assetlinks.json
            exit 1
          fi

          echo "Response:"
          jq . /tmp/assetlinks.json

          # Assert the expected package_name appears
          FOUND_PKG=$(jq -r '.[].target.package_name // empty' /tmp/assetlinks.json | grep -Fx "$EXPECTED_ANDROID_PACKAGE" || true)
          if [ -z "$FOUND_PKG" ]; then
            echo "ERROR: Expected package_name '$EXPECTED_ANDROID_PACKAGE' not found in assetlinks.json"
            exit 1
          fi

          # Assert the expected SHA-256 fingerprint appears
          FOUND_SHA=$(jq -r '.[].target.sha256_cert_fingerprints[]? // empty' /tmp/assetlinks.json | grep -Fx "$EXPECTED_ANDROID_SHA256" || true)
          if [ -z "$FOUND_SHA" ]; then
            echo "ERROR: Expected SHA-256 fingerprint not found in assetlinks.json"
            echo "Found fingerprints:"
            jq -r '.[].target.sha256_cert_fingerprints[]? // empty' /tmp/assetlinks.json
            exit 1
          fi

          echo "✓ assetlinks.json OK — package '$EXPECTED_ANDROID_PACKAGE' and fingerprint present"

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "Both deep-link verification files are reachable and contain the correct identifiers."
          echo "  • apple-app-site-association  → appID $EXPECTED_APPLE_APP_ID"
          echo "  • assetlinks.json             → package $EXPECTED_ANDROID_PACKAGE"
