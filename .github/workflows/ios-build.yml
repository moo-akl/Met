name: Build iOS .ipa (free macOS runner)

# Builds the Met iOS app on a free GitHub-hosted macOS runner using
# `eas build --local`, which uses ZERO EAS cloud credits. Output is uploaded
# as a downloadable workflow artifact.
#
# Free tier: GitHub gives ~2000 Actions minutes/month, but macOS minutes count
# 10x — so effectively ~200 macOS minutes (≈ 10–15 iOS builds per month).
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN              - From https://expo.dev/accounts/moakl/settings/access-tokens
#   EXPO_ASC_API_KEY_BASE64 - base64 of artifacts/met/.secrets/AuthKey_78GT7G5P5A.p8
#                             Run locally: base64 -i artifacts/met/.secrets/AuthKey_78GT7G5P5A.p8
#   EXPO_ASC_KEY_ID         - 78GT7G5P5A
#   EXPO_ASC_ISSUER_ID      - ace2baad-b6ed-4999-90c5-7f8cf8feb768
#   EXPO_APPLE_TEAM_ID      - AWHU9BTQQX

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview:device"
        type: choice
        options:
          - preview:device
          - preview
          - production
          - development
      submit:
        description: "Auto-upload to TestFlight after build (production profile only)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "ios-build-*"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: eas build --local (iOS)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EAS_NO_VCS: "1"
      EAS_SKIP_AUTO_FINGERPRINT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0.1 (required for App Store + stable for Expo SDK 54)
        run: |
          # Apple requires iOS 26 SDK (Xcode 26+) for App Store submissions.
          # Expo SDK 54 + RN 0.81.5 crashes with Xcode 26.3 due to a Hermes
          # memory-layout incompatibility (expo/expo#44606). We pin to 26.0.1
          # which is known to work, and apply a patch to RCTTurboModule.mm
          # that prevents the NSException->SIGABRT path.
          TARGET="/Applications/Xcode_26.0.1.app"
          if [ ! -d "$TARGET" ]; then
            TARGET="/Applications/Xcode_26.0.app"
          fi
          if [ ! -d "$TARGET" ]; then
            TARGET="/Applications/Xcode_26.2.app"
          fi
          if [ ! -d "$TARGET" ]; then
            TARGET="/Applications/Xcode_26.1.1.app"
          fi
          if [ ! -d "$TARGET" ]; then
            TARGET="/Applications/Xcode.app"
          fi
          DEV="$TARGET/Contents/Developer"
          if [ ! -d "$DEV" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            exit 1
          fi
          VER=$("$DEV/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
          echo "Selected:  $TARGET  (Xcode $VER)"
          sudo xcode-select -s "$DEV"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          ruby --version
          which pod || gem install cocoapods --no-document
          pod --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.9.1

      - name: Restore App Store Connect API key
        run: |
          mkdir -p artifacts/met/.secrets
          KEY_PATH="$(pwd)/artifacts/met/.secrets/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          echo "${{ secrets.EXPO_ASC_API_KEY_BASE64 }}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          echo "EXPO_ASC_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          echo "Wrote ASC key ($(wc -c < "${KEY_PATH}") bytes)"

      - name: Choose build profile
        id: profile
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="preview:device"; fi
          echo "name=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "Selected EAS profile: ${PROFILE}"

      - name: Build .ipa via EAS cloud (regenerates provisioning profile)
        working-directory: artifacts/met
        run: |
          # Temporary: cloud build forces EAS to regenerate the provisioning
          # profile with Push Notifications entitlement. After this succeeds
          # we revert to --local to save EAS credits.
          eas build \
            --platform ios \
            --profile "${{ steps.profile.outputs.name }}" \
            --non-interactive

      - name: Verify output
        run: |
          # Cloud builds don't produce a local .ipa; artifact is on EAS servers
          echo "Cloud build completed. Artifact available via Expo Dashboard."

      - name: Upload .ipa artifact
        if: false  # Cloud build artifact is on EAS servers, not local
        uses: actions/upload-artifact@v4
        with:
          name: met-ios-build-${{ github.run_number }}
          path: artifacts/met/met-ios.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit == 'true' && steps.profile.outputs.name == 'production' }}
        working-directory: artifacts/met
        run: |
          echo "Uploading met-ios.ipa to App Store Connect (TestFlight)..."
          eas submit \
            --platform ios \
            --profile production \
            --path "$(pwd)/met-ios.ipa" \
            --non-interactive
          echo "✅ Upload complete. Build will appear in App Store Connect → TestFlight → iOS Builds within ~5–10 minutes (status: Processing → Ready to Test)."

      - name: Submit skipped notice
        if: ${{ github.event.inputs.submit == 'true' && steps.profile.outputs.name != 'production' }}
        run: |
          echo "::warning::Submit was requested but profile is '${{ steps.profile.outputs.name }}', not 'production'. TestFlight only accepts App Store-signed builds. Re-run with profile=production to auto-submit."
