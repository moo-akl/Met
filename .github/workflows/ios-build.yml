name: Build iOS .ipa (free macOS runner)

# Builds the Met iOS app on a free GitHub-hosted macOS runner using
# `eas build --local`, which uses ZERO EAS cloud credits. Output is uploaded
# as a downloadable workflow artifact.
#
# Free tier: GitHub gives ~2000 Actions minutes/month, but macOS minutes count
# 10x — so effectively ~200 macOS minutes (≈ 10–15 iOS builds per month).
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN              - From https://expo.dev/accounts/moakl/settings/access-tokens
#   EXPO_ASC_API_KEY_BASE64 - base64 of artifacts/met/.secrets/AuthKey_78GT7G5P5A.p8
#                             Run locally: base64 -i artifacts/met/.secrets/AuthKey_78GT7G5P5A.p8
#   EXPO_ASC_KEY_ID         - 78GT7G5P5A
#   EXPO_ASC_ISSUER_ID      - ace2baad-b6ed-4999-90c5-7f8cf8feb768
#   EXPO_APPLE_TEAM_ID      - AWHU9BTQQX

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview:device"
        type: choice
        options:
          - preview
          - preview:device
          - production
      submit:
        description: "Auto-upload to TestFlight after build (production profile only)"
        required: false
        default: false
        type: boolean
      signing_profile_action:
        description: "Signing profile: none, read-only inspection, or targeted Ad Hoc replacement"
        required: false
        default: none
        type: choice
        options:
          - none
          - inspect
          - repair
      confirm_signing_repair:
        description: "Approve a replacement Ad Hoc profile, preserving certificate and devices"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "ios-build-*"

concurrency:
  group: met-ios-signing-app-met-founders
  cancel-in-progress: false

jobs:
  build:
    name: eas build --local (iOS)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EAS_NO_VCS: "1"
      EAS_SKIP_AUTO_FINGERPRINT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require explicit signing repair approval
        if: ${{ github.event.inputs.signing_profile_action == 'repair' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMED: ${{ github.event.inputs.confirm_signing_repair }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$CONFIRMED" != "true" ]; then
            echo "::error::Signing repair requires explicit manual confirmation."
            exit 1
          fi

      - name: Select latest Xcode with installed iOS SDK
        run: |
          # The macos-15 runner ships several Xcode versions, but only some
          # have the iOS platform SDK installed. Pick the newest one that does.
          BEST=""
          BEST_VER=""
          for app in $(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -Vr); do
            DEV="$app/Contents/Developer"
            if [ -d "$DEV/Platforms/iPhoneOS.platform/Developer/SDKs" ] && \
               ls "$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/" 2>/dev/null | grep -q "iPhoneOS.*\.sdk"; then
              VER=$("$DEV/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
              echo "Candidate: $app  (Xcode $VER, iOS SDK present)"
              if [ -z "$BEST" ]; then BEST="$app"; BEST_VER="$VER"; fi
            else
              echo "Skip:      $app  (no iOS SDK)"
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No Xcode with iOS SDK found on this runner."
            exit 1
          fi
          echo "Selected:  $BEST  (Xcode $BEST_VER)"
          sudo xcode-select -s "$BEST/Contents/Developer"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          ruby --version
          which pod || gem install cocoapods --no-document
          pod --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application types before signing
        run: pnpm run typecheck:libs && pnpm --filter @workspace/met run typecheck

      - name: Check iOS build integrity
        working-directory: artifacts/met
        run: node --test scripts/native-build-integrity.test.cjs scripts/sanitize-ios-build-log.test.cjs scripts/repair-ios-signing-profile.test.cjs

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.9.1

      - name: Restore App Store Connect API key
        if: ${{ github.event.inputs.signing_profile_action != 'inspect' }}
        run: |
          mkdir -p artifacts/met/.secrets
          KEY_PATH="$(pwd)/artifacts/met/.secrets/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          echo "${{ secrets.EXPO_ASC_API_KEY_BASE64 }}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          echo "EXPO_ASC_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          echo "Wrote ASC key ($(wc -c < "${KEY_PATH}") bytes)"

      - name: Choose build profile
        id: profile
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="preview:device"; fi
          case "$PROFILE" in
            preview)
              OUTPUT="met-ios-simulator.tar.gz"
              ;;
            preview:device|production)
              OUTPUT="met-ios.ipa"
              ;;
            *)
              echo "::error::Unsupported iOS build profile."
              exit 1
              ;;
          esac
          echo "name=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "output=${OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "Selected EAS profile: ${PROFILE}"

      - name: Inspect or repair Ad Hoc signing profile
        if: ${{ github.event.inputs.signing_profile_action == 'inspect' || github.event.inputs.signing_profile_action == 'repair' }}
        working-directory: artifacts/met
        env:
          SIGNING_ACTION: ${{ github.event.inputs.signing_profile_action }}
          BUILD_PROFILE: ${{ steps.profile.outputs.name }}
        run: |
          if [ "$SIGNING_ACTION" = "repair" ]; then
            if [ "$BUILD_PROFILE" != "preview:device" ]; then
              echo "::error::Ad Hoc repair requires the preview:device profile."
              exit 1
            fi
            node scripts/repair-ios-signing-profile.cjs --apply
          else
            node scripts/repair-ios-signing-profile.cjs
          fi

      - name: Build iOS locally (no EAS credits)
        if: ${{ github.event.inputs.signing_profile_action != 'inspect' }}
        working-directory: artifacts/met
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile "${{ steps.profile.outputs.name }}" \
            --local \
            --output "$(pwd)/${{ steps.profile.outputs.output }}" \
            --non-interactive 2>&1 | node scripts/sanitize-ios-build-log.cjs

      - name: Verify output
        if: ${{ github.event.inputs.signing_profile_action != 'inspect' }}
        run: |
          ls -lh "artifacts/met/${{ steps.profile.outputs.output }}"
          file "artifacts/met/${{ steps.profile.outputs.output }}"

      - name: Upload iOS build artifact
        if: ${{ github.event.inputs.signing_profile_action != 'inspect' }}
        uses: actions/upload-artifact@v4
        with:
          name: met-ios-build-${{ github.run_number }}
          path: artifacts/met/${{ steps.profile.outputs.output }}
          retention-days: 30
          if-no-files-found: error

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.signing_profile_action != 'inspect' && github.event.inputs.submit == 'true' && steps.profile.outputs.name == 'production' }}
        working-directory: artifacts/met
        run: |
          echo "Uploading met-ios.ipa to App Store Connect (TestFlight)..."
          eas submit \
            --platform ios \
            --profile production \
            --path "$(pwd)/${{ steps.profile.outputs.output }}" \
            --non-interactive
          echo "✅ Upload complete. Build will appear in App Store Connect → TestFlight → iOS Builds within ~5–10 minutes (status: Processing → Ready to Test)."

      - name: Submit skipped notice
        if: ${{ github.event.inputs.submit == 'true' && steps.profile.outputs.name != 'production' }}
        run: |
          echo "::warning::Submit was requested but profile is '${{ steps.profile.outputs.name }}', not 'production'. TestFlight only accepts App Store-signed builds. Re-run with profile=production to auto-submit."

      - name: Remove temporary signing key
        if: ${{ always() }}
        run: rm -f artifacts/met/.secrets/AuthKey_*.p8
