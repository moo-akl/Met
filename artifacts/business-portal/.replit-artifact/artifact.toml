kind = "web"
previewPath = "/business-portal/"
title = "Met Business Portal"
version = "1.0.0"
id = "artifacts/business-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/business-portal/" ]
localPort = 22981

[services.development]
run = "pnpm --filter @workspace/business-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/business-portal", "run", "build" ]
publicDir = "artifacts/business-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22981"
BASE_PATH = "/business-portal/"
