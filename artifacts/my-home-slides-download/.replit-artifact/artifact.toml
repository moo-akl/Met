kind = "web"
previewPath = "/my-home-slides-download/"
title = "My Home Slides Download"
description = "A standalone classroom resource page that provides a direct browser download for the high-resolution My Home Cambridge YLE Starters PDF deck."
version = "1.0.0"
id = "artifacts/my-home-slides-download"
router = "path"

[[services]]
name = "web"
paths = [ "/my-home-slides-download/" ]
localPort = 20957

[services.development]
run = "pnpm --filter @workspace/my-home-slides-download run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-home-slides-download", "run", "build" ]
serve = "static"
publicDir = "artifacts/my-home-slides-download/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20957"
BASE_PATH = "/my-home-slides-download/"
