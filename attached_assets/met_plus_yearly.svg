  <text x="215" y="857" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="17" font-weight="700" fill="#000" text-anchor="middle" letter-spacing="-0.3">Subscribe for $29.99 / yr</text>

  <!-- Sub note -->
  <text x="215" y="900" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.25" text-anchor="middle">Cancel anytime · Renews annually · ~$2.50/month</text>
</svg>
