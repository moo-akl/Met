  <polyline points="56,546 61,551 70,541" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="551" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">Unlimited</tspan> daily encounters</text>

  <circle cx="62" cy="592" r="13" fill="#92C977"/>
  <polyline points="56,592 61,597 70,587" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="597" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">Unlimited</tspan> reveal requests</text>

  <circle cx="62" cy="638" r="13" fill="#92C977"/>
  <polyline points="56,638 61,643 70,633" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="643" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">3 profile photos</tspan> to show your personality</text>

  <circle cx="62" cy="684" r="13" fill="#92C977"/>
  <polyline points="56,684 61,689 70,679" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="689" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">1 opening message</tspan> per day</text>

  <circle cx="62" cy="730" r="13" fill="#92C977"/>
  <polyline points="56,730 61,735 70,725" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="735" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88">Full history &amp; <tspan font-weight="700" fill="#FFFFFF">read receipts</tspan></text>

  <circle cx="62" cy="776" r="13" fill="#92C977"/>
  <polyline points="56,776 61,781 70,771" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="781" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88">See <tspan font-weight="700" fill="#FFFFFF">frequent paths</tspan> — people you keep crossing</text>

  <!-- CTA button -->
