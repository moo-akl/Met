<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8D98A"/>
      <stop offset="100%" stop-color="#7BBF5C"/>
    </linearGradient>
    <clipPath id="phone">
      <rect width="393" height="852" rx="44"/>
    </clipPath>
  </defs>

  <!-- Phone body -->
  <rect width="393" height="852" rx="44" fill="url(#bg)" clip-path="url(#phone)"/>

  <!-- Status bar -->
  <text x="36" y="26" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="15" font-weight="600" fill="#fff">9:41</text>
  <!-- Signal bars -->
  <rect x="298" y="17" width="4" height="8" rx="1" fill="#fff"/>
  <rect x="305" y="14" width="4" height="11" rx="1" fill="#fff"/>
  <rect x="312" y="11" width="4" height="14" rx="1" fill="#fff"/>
  <rect x="319" y="8" width="4" height="17" rx="1" fill="#fff"/>
  <!-- WiFi -->
  <path d="M330 21 Q335 16 340 21" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M327 18 Q335 11 343 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="335" cy="23" r="2" fill="#fff"/>
  <!-- Battery -->
  <rect x="350" y="13" width="28" height="14" rx="3.5" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.2"/>
  <rect x="352" y="15" width="22" height="10" rx="2" fill="#fff"/>
  <rect x="379" y="17" width="2.5" height="6" rx="1.2" fill="#fff" fill-opacity="0.5"/>

  <!-- Dynamic island -->
  <rect x="148" y="10" width="97" height="30" rx="20" fill="#000"/>

  <!-- Header -->
  <text x="196" y="88" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Upgrade</text>
  <!-- Close X -->
  <circle cx="355" cy="84" r="14" fill="#fff" fill-opacity="0.1"/>
  <line x1="349" y1="78" x2="361" y2="90" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="361" y1="78" x2="349" y2="90" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- Tab selector: Plus | Pro -->
  <rect x="20" y="108" width="353" height="44" rx="14" fill="#1A1A1A"/>
  <!-- Plus tab active -->
  <rect x="24" y="112" width="171" height="36" rx="11" fill="#92C977"/>
  <text x="110" y="136" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Plus</text>
  <!-- Pro tab -->
  <text x="285" y="136" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="15" font-weight="600" fill="#fff" fill-opacity="0.5" text-anchor="middle">Pro</text>

  <!-- Billing toggle: Monthly | Yearly -->
  <rect x="20" y="166" width="353" height="40" rx="12" fill="#1A1A1A"/>
  <!-- Monthly active -->
  <rect x="24" y="170" width="171" height="32" rx="9" fill="#2A2A2A"/>
  <text x="110" y="191" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Monthly</text>
  <text x="285" y="191" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.4" text-anchor="middle">Yearly</text>

  <!-- Price hero -->
  <text x="196" y="250" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="58" font-weight="900" fill="#92C977" text-anchor="middle" letter-spacing="-2">$2.99</text>
  <text x="196" y="278" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" font-weight="400" fill="#fff" fill-opacity="0.4" text-anchor="middle">per month · billed monthly</text>

  <!-- Divider -->
  <line x1="20" y1="302" x2="373" y2="302" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Feature rows -->
  <!-- row 1 -->
  <text x="36" y="332" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Daily encounters</text>
  <text x="357" y="332" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" font-weight="700" fill="#92C977" text-anchor="end">Unlimited</text>
  <line x1="20" y1="344" x2="373" y2="344" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 2 -->
  <text x="36" y="370" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Profile photos</text>
  <text x="357" y="370" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" font-weight="700" fill="#92C977" text-anchor="end">3 photos</text>
  <line x1="20" y1="382" x2="373" y2="382" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 3 -->
  <text x="36" y="408" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Reveal requests</text>
  <text x="357" y="408" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" font-weight="700" fill="#92C977" text-anchor="end">Unlimited</text>
  <line x1="20" y1="420" x2="373" y2="420" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 4 -->
  <text x="36" y="446" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Opening messages</text>
  <text x="357" y="446" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" font-weight="700" fill="#92C977" text-anchor="end">1 / day</text>
  <line x1="20" y1="458" x2="373" y2="458" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 5 -->
  <text x="36" y="484" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Full encounter history</text>
  <!-- checkmark -->
  <circle cx="350" cy="479" r="10" fill="#92C977" fill-opacity="0.15"/>
  <polyline points="345,479 349,483 357,475" fill="none" stroke="#92C977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="496" x2="373" y2="496" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 6 -->
  <text x="36" y="522" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Read receipts</text>
  <circle cx="350" cy="517" r="10" fill="#92C977" fill-opacity="0.15"/>
  <polyline points="345,517 349,521 357,513" fill="none" stroke="#92C977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="534" x2="373" y2="534" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 7 -->
  <text x="36" y="560" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Privacy mode</text>
  <circle cx="350" cy="555" r="10" fill="#92C977" fill-opacity="0.15"/>
  <polyline points="345,555 349,559 357,551" fill="none" stroke="#92C977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="572" x2="373" y2="572" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- row 8 -->
  <text x="36" y="598" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="14" fill="#fff" fill-opacity="0.7">Frequent paths</text>
  <circle cx="350" cy="593" r="10" fill="#92C977" fill-opacity="0.15"/>
  <polyline points="345,593 349,597 357,589" fill="none" stroke="#92C977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CTA Button -->
  <rect x="20" y="668" width="353" height="56" rx="16" fill="url(#btnGrad)"/>
  <text x="196" y="702" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="17" font-weight="700" fill="#000" text-anchor="middle">Subscribe · $2.99 / mo</text>

  <!-- Restore + terms -->
  <text x="196" y="742" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="12" fill="#fff" fill-opacity="0.3" text-anchor="middle">Restore purchases</text>
  <text x="196" y="762" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-size="11" fill="#fff" fill-opacity="0.2" text-anchor="middle">Cancel anytime. Auto-renews monthly.</text>

  <!-- Home indicator -->
  <rect x="152" y="824" width="89" height="5" rx="2.5" fill="#fff" fill-opacity="0.3"/>
</svg>
