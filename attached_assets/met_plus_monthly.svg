<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
  <defs>
    <radialGradient id="glow1" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#92C977" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#92C977" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#92C977" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#92C977" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundedClip">
      <rect width="430" height="932" rx="48"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="430" height="932" rx="48" fill="#0C0C0C"/>
  <rect width="430" height="932" rx="48" fill="url(#glow1)"/>
  <rect width="430" height="932" rx="48" fill="url(#glow2)"/>

  <!-- Logo row -->
  <rect x="36" y="52" width="34" height="34" rx="10" fill="#92C977"/>
  <!-- Users icon -->
  <circle cx="49" cy="63" r="5" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M42 78 Q42 73 49 73 Q56 73 56 78" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <text x="80" y="75" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Met</text>

  <!-- Plus badge -->
  <rect x="332" y="52" width="60" height="30" rx="15" fill="#92C977"/>
  <text x="362" y="72" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="13" font-weight="700" fill="#000" text-anchor="middle" letter-spacing="0.5">PLUS</text>

  <!-- Hero label -->
  <text x="215" y="148" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle" letter-spacing="2">SUBSCRIPTION</text>

  <!-- Plan name -->
  <text x="215" y="210" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">Met</text>
  <text x="215" y="270" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="54" font-weight="900" fill="#92C977" text-anchor="middle" letter-spacing="-2">Plus</text>

  <!-- Tagline -->
  <text x="215" y="312" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">Unlock the full Met experience.</text>
  <text x="215" y="332" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">Meet more, reveal more.</text>

  <!-- Price card -->
  <rect x="36" y="356" width="358" height="130" rx="24" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <text x="215" y="416" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="64" font-weight="900" fill="#92C977" text-anchor="middle" letter-spacing="-3">$2.99</text>
  <text x="215" y="460" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">per month</text>

  <!-- Feature list -->
  <!-- Row 1 -->
  <circle cx="62" cy="528" r="13" fill="#92C977"/>
  <polyline points="56,528 61,533 70,523" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="533" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">Unlimited</tspan> daily encounters</text>

  <!-- Row 2 -->
  <circle cx="62" cy="574" r="13" fill="#92C977"/>
  <polyline points="56,574 61,579 70,569" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="579" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">Unlimited</tspan> reveal requests</text>

  <!-- Row 3 -->
  <circle cx="62" cy="620" r="13" fill="#92C977"/>
  <polyline points="56,620 61,625 70,615" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="625" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">3 profile photos</tspan> to show your personality</text>

  <!-- Row 4 -->
  <circle cx="62" cy="666" r="13" fill="#92C977"/>
  <polyline points="56,666 61,671 70,661" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="671" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">1 opening message</tspan> per day</text>

  <!-- Row 5 -->
  <circle cx="62" cy="712" r="13" fill="#92C977"/>
  <polyline points="56,712 61,717 70,707" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="717" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88">Full history &amp; <tspan font-weight="700" fill="#FFFFFF">read receipts</tspan></text>

  <!-- Row 6 -->
  <circle cx="62" cy="758" r="13" fill="#92C977"/>
  <polyline points="56,758 61,763 70,753" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="763" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88">See <tspan font-weight="700" fill="#FFFFFF">frequent paths</tspan> — people you keep crossing</text>

  <!-- CTA button -->
  <rect x="36" y="808" width="358" height="60" rx="18" fill="#92C977"/>
  <text x="215" y="845" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="17" font-weight="700" fill="#000" text-anchor="middle" letter-spacing="-0.3">Subscribe for $2.99 / mo</text>

  <!-- Sub note -->
  <text x="215" y="890" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.25" text-anchor="middle">Cancel anytime · Auto-renews monthly</text>
</svg>
