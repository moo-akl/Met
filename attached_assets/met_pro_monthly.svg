<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
  <defs>
    <radialGradient id="glow1" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="430" height="932" rx="48" fill="#080C09"/>
  <rect width="430" height="932" rx="48" fill="url(#glow1)"/>
  <rect width="430" height="932" rx="48" fill="url(#glow2)"/>

  <!-- Logo row -->
  <rect x="36" y="52" width="34" height="34" rx="10" fill="url(#proGrad)"/>
  <!-- Star icon -->
  <polygon points="53,57 54.8,62.6 60.7,62.6 56,65.9 57.7,71.5 53,68.2 48.3,71.5 50,65.9 45.3,62.6 51.2,62.6" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="80" y="75" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Met</text>

  <!-- Pro badge -->
  <rect x="341" y="52" width="51" height="30" rx="15" fill="url(#proGrad)"/>
  <text x="367" y="72" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="0.5">PRO</text>

  <!-- Hero label -->
  <text x="215" y="148" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle" letter-spacing="2">PREMIUM PLAN</text>

  <!-- Plan name -->
  <text x="215" y="210" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">Met</text>
  <text x="215" y="270" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="54" font-weight="900" fill="#4ADE80" text-anchor="middle" letter-spacing="-2">Pro</text>

  <!-- Tagline -->
  <text x="215" y="312" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">The ultimate Met experience.</text>
  <text x="215" y="332" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">Everything, no limits.</text>

  <!-- Price card -->
  <rect x="36" y="356" width="358" height="130" rx="24" fill="#22C55E" fill-opacity="0.06" stroke="#22C55E" stroke-opacity="0.2" stroke-width="1.5"/>
  <text x="215" y="416" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="64" font-weight="900" fill="#4ADE80" text-anchor="middle" letter-spacing="-3">$4.99</text>
  <text x="215" y="460" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">per month</text>

  <!-- Feature list -->
  <circle cx="62" cy="528" r="13" fill="url(#proGrad)"/>
  <polyline points="56,528 61,533 70,523" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="533" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">Unlimited</tspan> encounters &amp; reveals</text>

  <circle cx="62" cy="574" r="13" fill="url(#proGrad)"/>
  <polyline points="56,574 61,579 70,569" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="579" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">6 profile photos</tspan> — show every side of you</text>

  <circle cx="62" cy="620" r="13" fill="url(#proGrad)"/>
  <polyline points="56,620 61,625 70,615" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="625" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">2 opening messages</tspan> per day</text>

  <circle cx="62" cy="666" r="13" fill="url(#proGrad)"/>
  <polyline points="56,666 61,671 70,661" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="671" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88">Full history, <tspan font-weight="700" fill="#FFFFFF">read receipts</tspan> &amp; frequent paths</text>

  <circle cx="62" cy="712" r="13" fill="url(#proGrad)"/>
  <polyline points="56,712 61,717 70,707" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="717" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88">Everything in <tspan font-weight="700" fill="#FFFFFF">Met Plus</tspan>, and more</text>

  <circle cx="62" cy="758" r="13" fill="url(#proGrad)"/>
  <polyline points="56,758 61,763 70,753" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="763" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.88"><tspan font-weight="700" fill="#FFFFFF">Priority support</tspan> from the Met team</text>

  <!-- CTA button -->
  <rect x="36" y="808" width="358" height="60" rx="18" fill="url(#proGrad)"/>
  <text x="215" y="845" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="-0.3">Subscribe for $4.99 / mo</text>

  <!-- Sub note -->
  <text x="215" y="890" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.25" text-anchor="middle">Cancel anytime · Auto-renews monthly</text>
</svg>
